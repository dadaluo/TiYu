name: Build APK

on:
  push:
    branches: [ main ]
    # 纯文档提交不触发构建：避免同版本号 tag 重复发布
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.17.0
  APP_VERSION_TAG: v2.17.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 固定签名：从 secrets 恢复 keystore，保证每个版本签名一致、可覆盖安装
      - name: Restore signing keystore
        run: |
          echo "${{ secrets.DQ_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/dronequiz.keystore"
          echo "DQ_KS_PATH=$RUNNER_TEMP/dronequiz.keystore" >> "$GITHUB_ENV"
          echo "DQ_KS_STORE_PASS=${{ secrets.DQ_KS_STORE_PASS }}" >> "$GITHUB_ENV"

      # v2.16.0 起含 native 构建（externalNativeBuild/cmake，libdroneocr.so）：
      # 显式装齐 ndkVersion 27.2.12479018 + cmake 3.22.1，不依赖 AGP 在线自动安装
      - name: Install NDK & CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiYu-${{ env.APP_VERSION_NAME }}
          path: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION_TAG }}
          name: 题屿 TiYu ${{ env.APP_VERSION_TAG }}
          files: dist/TiYu-${{ env.APP_VERSION_NAME }}.apk
          body: |
            ## 题屿 TiYu v2.17.0

            ### 新功能 —— 解析支持 Markdown 排版

            - 刷题、搜索结果和错题回顾的解析区统一支持 Markdown，
              标题、列表、引用等长文结构更清晰，并沿用当前阅读字体和主题色。
            - 升级 AGP 9.1.1、Gradle 9.7.1、Kotlin 2.4.20、Compose BOM 2026.09.00
              以及 AndroidX / kotlinx 依赖，compileSdk 升至 37。
            - 已同步上游 v2.16.0：PaddleOCR + MNN 拍照搜题、模型按需下载、
              CameraX 和 AlarmManager 提醒链路全部保留。
            - 项目发布与检查更新链路迁移至 `dadaluo/TiYu`。

            ---

            **安装**：下载下方 `TiYu-2.17.0.apk` 安装覆盖即可，数据无需迁移。
